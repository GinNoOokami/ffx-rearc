name: Final Fantasy X International (JP)
sha1: 143a49aad843f367036e7dbfcce3094fbd5b4ca1

options:
  # What we're splitting
  basename: SLPS_250.88
  platform: ps2
  compiler: EEGCC

  # Where things are. All paths are relative to base_path, the repo root seen from this file.
  base_path: ../..
  target_path: build/jp_intl/orig/SLPS_250.88.bin
  symbol_addrs_path: config/jp_intl/symbol_addrs.txt
  extensions_path: tools/splat_ext
  src_path: src

  # Hand-written asm (hasm segments) is source: written to src/ once, never overwritten.
  hasm_in_src_path: True

  # Where splat writes. Everything generated is per version.
  asm_path: asm/jp_intl
  asset_path: assets/jp_intl
  build_path: build/jp_intl
  cache_path: asm/jp_intl/.splache
  ld_script_path: asm/jp_intl/SLPS_250.88.ld
  undefined_funcs_auto_path: asm/jp_intl/undefined_funcs_auto.txt
  undefined_syms_auto_path: asm/jp_intl/undefined_syms_auto.txt

  # For each C file, a make dependency file listing the asm files its INCLUDE_ASMs pull in
  # (build/jp_intl/src/<file>.asmproc.d).
  create_asm_dependencies: True

  # Linking: gp, section order and packing as in the original
  gp_value: 0x5841F0
  ld_gp_expression: "0x5841F0"
  section_order: [.text, .data, .rodata, .vutext, .lit4, .sbss, .bss]
  auto_link_sections: [.data, .rodata, .lit4]
  subalign: 8
  ld_align_segment_vram_end: False
  ld_align_section_vram_end: False

  # Disassembly
  find_file_boundaries: False
  mips_abi_gpr: numeric
  named_regs_for_c_funcs: False
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2

segments:
- name: ffx
  type: code
  start: 0x000000
  vram: 0x00100000
  subsegments:
    - [0x000000, asm, text]
    - [0x01D230, c, main/11D230]
    - [0x01D740, asm, 11D740]
    - [0x154830, c, archive/decode]
    - [0x154958, asm, 254958]
    - [0x155928, hasm, archive/255928]
    - [0x155FB8, asm, 255FB8]
    - [0x200180, data, data]
    - [0x226CD0, .data, archive/decode]
    - [0x226CE0, data, 326CE0]
    - [0x4698E8, .rodata, main/11D230]
    - [0x469950, rodata, 569950]
    - [0x4733C8, .rodata, archive/decode]
    - [0x4733E0, rodata, 5733E0]
    - [0x478980, vutext, vutext]
    - [0x47C200, lit4, lit4]
- name: zerofill
  type: code
  start: 0x47C68C
  vram: 0x0057C700
  bss_size: 0x2187E8
  subsegments:
    - { type: sbss, vram: 0x0057C700, name: sbss }
    - { type: bss,  vram: 0x0057C780, name: bss }
- [0x47C68C]